apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-frontend
  namespace: iris
  annotations:
    checkov.io/skip1: CKV_K8S_43=Images are referenced by commit tag in an Artifact Registry repo with immutable tags, so a tag cannot be repointed
spec:
  replicas: 1
  selector:
    matchLabels: { app: iris-frontend }
  template:
    metadata:
      labels: { app: iris-frontend }
    spec:
      automountServiceAccountToken: false # the frontend never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: frontend # replaced by kustomize with the full image and tag
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp } # nginx writes its pid and cache here
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: iris-frontend
  namespace: iris
spec:
  type: ClusterIP
  selector: { app: iris-frontend }
  ports:
    - { port: 80, targetPort: 8080 }
