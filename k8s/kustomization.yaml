apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - gateway.yaml

# The only lines CI changes: which image tag runs.
# ArgoCD sees the new commit and rolls it out.
images:
  - name: backend
    newName: europe-west1-docker.pkg.dev/gcp-lab-idir-2026/iris-dev-images/backend
    newTag: not-built-yet
  - name: frontend
    newName: europe-west1-docker.pkg.dev/gcp-lab-idir-2026/iris-dev-images/frontend
    newTag: not-built-yet
