# The backend's Kubernetes identity. Its name and namespace match the IAM
# bindings in bootstrap/backend_identity.tf (Workload Identity).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iris-backend
  namespace: iris
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-backend
  namespace: iris
spec:
  replicas: 1
  selector:
    matchLabels: { app: iris-backend }
  template:
    metadata:
      labels: { app: iris-backend }
    spec:
      serviceAccountName: iris-backend
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: backend # replaced by kustomize with the full image and tag
          ports:
            - containerPort: 8080
          env:
            - { name: PROJECT_ID, value: gcp-lab-idir-2026 }
            - { name: REGION, value: europe-west1 }
            - { name: MODEL_NAME, value: iris-classifier }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }
          # Loading the model from the registry takes a few seconds at startup
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 24 # up to 2 minutes to start
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp } # the model is downloaded here
      volumes:
        - name: tmp
          emptyDir: {}
---
# Internal only: reachable inside the cluster, never from the internet
apiVersion: v1
kind: Service
metadata:
  name: iris-backend
  namespace: iris
spec:
  type: ClusterIP
  selector: { app: iris-backend }
  ports:
    - { port: 8080, targetPort: 8080 }
