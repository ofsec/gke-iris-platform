server {
    listen 8080;
    server_tokens off; # don't advertise the nginx version

    # Basic security headers (Phase 3's scanner will check for these)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    root /usr/share/nginx/html;

    # The page itself
    location / {
        try_files $uri /index.html;
    }

    # Probe for Kubernetes: answers without touching the backend
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Forward predictions to the backend, over the cluster's internal network
    location = /predict {
        proxy_pass http://iris-backend:8080/predict;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
}
