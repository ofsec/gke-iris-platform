<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris Classifier</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; color: #1d2433; background: #f6f7fb; }
  h1 { font-size: 1.6rem; margin-bottom: .2rem; }
  p.sub { color: #5b6477; margin-top: 0; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin: 1.5rem 0; }
  label { display: flex; flex-direction: column; font-size: .85rem; color: #5b6477; gap: .3rem; }
  input { font-size: 1rem; padding: .5rem; border: 1px solid #c9cedb; border-radius: 6px; }
  .actions { grid-column: 1 / -1; display: flex; gap: .5rem; flex-wrap: wrap; }
  button { font-size: .95rem; padding: .55rem .9rem; border-radius: 6px; border: 1px solid #2f5bd3; background: #2f5bd3; color: #fff; cursor: pointer; }
  button.sample { background: #fff; color: #2f5bd3; }
  #result { padding: 1rem; border-radius: 8px; background: #fff; border: 1px solid #dde1ea; min-height: 3rem; }
  #species { font-size: 1.4rem; font-weight: 600; }
  #model { font-size: .75rem; color: #5b6477; word-break: break-all; margin-top: .4rem; }
</style>
</head>
<body>
  <h1>Iris Classifier</h1>
  <p class="sub">Enter a flower's measurements in centimeters. The model runs on GKE and was trained by a Vertex AI pipeline.</p>

  <form id="form">
    <label>Sepal length <input id="sl" type="number" step="0.1" min="0" value="5.1" required></label>
    <label>Sepal width  <input id="sw" type="number" step="0.1" min="0" value="3.5" required></label>
    <label>Petal length <input id="pl" type="number" step="0.1" min="0" value="1.4" required></label>
    <label>Petal width  <input id="pw" type="number" step="0.1" min="0" value="0.2" required></label>
    <div class="actions">
      <button type="submit">Classify</button>
      <button type="button" class="sample" data-v="5.1,3.5,1.4,0.2">Setosa sample</button>
      <button type="button" class="sample" data-v="6.0,2.9,4.5,1.5">Versicolor sample</button>
      <button type="button" class="sample" data-v="6.7,3.0,5.2,2.3">Virginica sample</button>
    </div>
  </form>

  <div id="result"><div id="species">No prediction yet</div><div id="model"></div></div>

<script>
  const ids = ["sl", "sw", "pl", "pw"];
  document.querySelectorAll(".sample").forEach(b => b.addEventListener("click", () => {
    b.dataset.v.split(",").forEach((v, i) => document.getElementById(ids[i]).value = v);
  }));
  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    const instance = ids.map(id => parseFloat(document.getElementById(id).value));
    const species = document.getElementById("species"), model = document.getElementById("model");
    species.textContent = "Classifying…"; model.textContent = "";
    try {
      const r = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ instances: [instance] }) });
      if (!r.ok) throw new Error(`Backend answered ${r.status}`);
      const data = await r.json();
      species.textContent = data.predictions[0].species;
      model.textContent = `Model: ${data.model}`;
    } catch (err) {
      species.textContent = "Prediction failed";
      model.textContent = err.message;
    }
  });
</script>
</body>
</html>
