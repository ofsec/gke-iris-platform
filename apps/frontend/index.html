<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris Classifier</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Iris Classifier</h1>
  <p class="sub">Enter a flower's measurements in centimeters. The model runs on GKE and was trained by a Vertex AI pipeline.</p>

  <form id="form">
    <label>Sepal length <input id="sl" type="number" step="0.1" min="0" value="5.1" required></label>
    <label>Sepal width  <input id="sw" type="number" step="0.1" min="0" value="3.5" required></label>
    <label>Petal length <input id="pl" type="number" step="0.1" min="0" value="1.4" required></label>
    <label>Petal width  <input id="pw" type="number" step="0.1" min="0" value="0.2" required></label>
    <div class="actions">
      <button type="submit">Classify</button>
      <button type="button" class="sample" data-v="5.1,3.5,1.4,0.2">Setosa sample</button>
      <button type="button" class="sample" data-v="6.0,2.9,4.5,1.5">Versicolor sample</button>
      <button type="button" class="sample" data-v="6.7,3.0,5.2,2.3">Virginica sample</button>
    </div>
  </form>

  <div id="result"><div id="species">No prediction yet</div><div id="model"></div></div>

<script src="app.js"></script>
</body>
</html>
