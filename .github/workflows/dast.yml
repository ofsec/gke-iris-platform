name: dast
on:
  schedule:
    - cron: "0 3 * * *"   # every night at 03:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline scan (passive)
        run: |
          mkdir -p zap && chmod 777 zap && cp .zap/rules.tsv zap/
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ vars.APP_URL }}" -c rules.tsv -I \
            -r report.html -w report.md
      - name: Publish summary
        if: always()
        run: cat zap/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/report.html
