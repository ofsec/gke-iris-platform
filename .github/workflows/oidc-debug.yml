
name: oidc-debug

on: pull_request

permissions:

  id-token: write

  contents: read

jobs:

  claims:

    runs-on: ubuntu-latest

    steps:

      - name: Show the claims in GitHub's OIDC token (not the token itself)

        run: |

          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)

          echo "$TOKEN" | python3 -c "import sys,base64,json; p=sys.stdin.read().split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k: c.get(k) for k in ['sub','repository','repository_owner','repository_owner_id','ref','event_name']}, indent=2))"

