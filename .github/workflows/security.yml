name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write            # publish results to the Security tab
  actions: read

jobs:
  # Kubernetes manifests (as ArgoCD will apply them) and Dockerfiles
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet checkov

      - name: Render the manifests the way ArgoCD will apply them
        run: kustomize build k8s > rendered-manifests.yaml

      - name: Checkov (Kubernetes, rendered)
        run: |
          checkov -f rendered-manifests.yaml --framework kubernetes --quiet --compact \
            -o cli -o sarif --output-file-path console,checkov-k8s.sarif

      - name: Checkov (Dockerfiles)
        if: always()
        run: |
          checkov -d apps --framework dockerfile --quiet --compact \
            -o cli -o sarif --output-file-path console,checkov-docker.sarif

      - name: Publish Kubernetes results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-k8s.sarif
          category: checkov-kubernetes

      - name: Publish Dockerfile results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-docker.sarif
          category: checkov-dockerfile

  # Secrets committed by mistake, across the whole Git history
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST: analyses the Python and JavaScript code for vulnerable patterns
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}
